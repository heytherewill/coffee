<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#56351f">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Elms+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <title>Coffee Recipes</title>
  </head>
  <body>
    <header class="hero">
      <div class="hero__content">
        <p class="eyebrow">Will &amp; Dani's kitchen</p>
        <h1>Coffee recipes</h1>
        <p class="hero__intro">tome café gostoso demais.</p>
      </div>
    </header>
    <main>
      <section class="menu" aria-labelledby="menu-title">
        <div class="menu__heading">
          <div>
            <p class="eyebrow">Choose a brew</p>
            <h2 id="menu-title">Today’s coffee menu</h2>
          </div>
          <div class="menu__actions">
            <p id="recipe-count" class="recipe-count" aria-live="polite"></p>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
              <span aria-hidden="true">◐</span>
              <span>Dark mode</span>
            </button>
          </div>
        </div>
        <form id="filters" class="filters" role="search">
          <div class="filter-search">
            <label for="recipe-search">Search recipes</label>
            <input id="recipe-search" name="q" type="search" placeholder="V60, cold brew, 200 ml" autocomplete="off">
          </div>
          <div class="filter-select">
            <label for="method-filter">Method</label>
            <select id="method-filter" name="method"><option value="">All methods</option></select>
          </div>
          <div class="filter-select">
            <label for="time-filter">Ready in</label>
            <select id="time-filter" name="time">
              <option value="">Any time</option>
              <option value="quick">Under 5 min</option>
              <option value="medium">5–15 min</option>
              <option value="ahead">Make ahead</option>
            </select>
          </div>
          <div class="filter-select">
            <label for="temperature-filter">Temperature</label>
            <select id="temperature-filter" name="temperature">
              <option value="">Hot or cold</option>
              <option value="hot">Hot</option>
              <option value="cold">Cold</option>
            </select>
          </div>
          <button id="clear-filters" class="clear-filters" type="button" hidden>Clear filters</button>
        </form>
        <div id="recipes" aria-live="polite"></div>
      </section>
    </main>
    <footer>Made with love and caffeine by Will and Dani</footer>
    <script src="https://kit.fontawesome.com/9547112b26.js" crossorigin="anonymous"></script>
    <script src="index.js"></script>
  </body>
</html>
